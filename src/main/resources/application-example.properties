spring.application.name=memoryguard-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/memoryguard
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# ===================================================================
# AI Semantic Layer Configuration
# ===================================================================
memoryguard.ai.enabled=false
memoryguard.ai.provider=gemini
memoryguard.ai.model=gemini-2.5-flash
memoryguard.ai.api-key=YOUR_GEMINI_API_KEY
memoryguard.ai.connect-timeout-ms=1000
memoryguard.ai.read-timeout-ms=3000
memoryguard.ai.max-input-length=2000

# Parallel security analyzer execution settings
memoryguard.security.analysis.parallelism=2
memoryguard.security.analysis.timeout-ms=1500
