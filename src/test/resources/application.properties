spring.application.name=memoryguard-backend-test

spring.datasource.url=jdbc:h2:mem:memoryguardtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

memoryguard.ai.enabled=false
memoryguard.ai.provider=gemini
memoryguard.ai.model=gemini-2.5-flash
memoryguard.ai.api-key=
memoryguard.ai.connect-timeout-ms=1000
memoryguard.ai.read-timeout-ms=3000
memoryguard.ai.max-input-length=2000

memoryguard.security.analysis.parallelism=2
memoryguard.security.analysis.timeout-ms=1500
