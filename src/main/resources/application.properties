spring.application.name=memoryguard-backend

# ===================================================================
# Database Configuration (Environment Driven - Fail Closed)
# ===================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# ===================================================================
# JPA / Hibernate Configuration (Schema Validation Only)
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# Server & Port Configuration
# ===================================================================
server.port=${PORT:8081}

# ===================================================================
# AI Semantic Layer Configuration
# ===================================================================
memoryguard.ai.enabled=${MEMORYGUARD_AI_ENABLED:false}
memoryguard.ai.provider=${MEMORYGUARD_AI_PROVIDER:gemini}
memoryguard.ai.model=${MEMORYGUARD_AI_MODEL:gemini-2.5-flash}
memoryguard.ai.api-key=${MEMORYGUARD_AI_API_KEY:}
memoryguard.ai.connect-timeout-ms=${MEMORYGUARD_AI_CONNECT_TIMEOUT_MS:1000}
memoryguard.ai.read-timeout-ms=${MEMORYGUARD_AI_READ_TIMEOUT_MS:3000}
memoryguard.ai.max-input-length=${MEMORYGUARD_AI_MAX_INPUT_LENGTH:2000}

# ===================================================================
# Security Analysis Configuration
# ===================================================================
memoryguard.security.analysis.parallelism=${MEMORYGUARD_SECURITY_PARALLELISM:2}
memoryguard.security.analysis.timeout-ms=${MEMORYGUARD_SECURITY_TIMEOUT_MS:1500}